# This configuration file is for the **development** setup.
# For a production example please refer to getredash/setup repository on GitHub.
#
# Bind-mount `.:/app` so the repo (including `client/dist` after `yarn build`) is what the
# container serves. Run `yarn build` on the host when changing the frontend; db-logos and other
# assets under `client/dist/images/` are copied there by webpack (see webpack.config.js).
#
# Fresh clone with no `client/dist` yet: `docker compose build` (builds the UI in the image)
# then `docker compose up`, or run `yarn build` before `docker compose up`.
x-redash-service: &redash-service
  build:
    context: .
    args:
      skip_frontend_build: "" # set to empty string to build
      poetry_groups: athena,dev # dev compose: pytest + all query runners for tests
  volumes:
    - .:/app
  env_file:
    - .env
x-redash-environment: &redash-environment
  REDASH_HOST: http://localhost:5000
  REDASH_LOG_LEVEL: "INFO"
  REDASH_REDIS_URL: "redis://redis:6379/0"
  REDASH_DATABASE_URL: "postgresql://postgres@postgres/postgres"
  REDASH_RATELIMIT_ENABLED: "false"
  REDASH_MAIL_DEFAULT_SENDER: "redash@example.com"
  REDASH_MAIL_SERVER: "email"
  REDASH_MAIL_PORT: 1025
  REDASH_ENFORCE_CSRF: "true"
  REDASH_GUNICORN_TIMEOUT: 60
  # Override Dockerfile production default so dev/tests can use sqlite etc.
  REDASH_ENABLED_QUERY_RUNNERS: "redash.query_runner.athena,redash.query_runner.query_results,redash.query_runner.sqlite"
  # Set secret keys in the .env file
services:
  server:
    <<: *redash-service
    command: dev_server
    depends_on:
      - postgres
      - redis
    ports:
      - "5001:5000"
      - "5678:5678"
    environment:
      <<: *redash-environment
      PYTHONUNBUFFERED: 0
  scheduler:
    <<: *redash-service
    command: dev_scheduler
    depends_on:
      - server
    environment:
      <<: *redash-environment
  worker:
    <<: *redash-service
    command: dev_worker
    depends_on:
      - server
    environment:
      <<: *redash-environment
      PYTHONUNBUFFERED: 0
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    ports:
      - "15432:5432"
    # The following turns the DB into less durable, but gains significant performance improvements for the tests run (x3
    # improvement on my personal machine). We should consider moving this into a dedicated Docker Compose configuration for
    # tests.
    command: "postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=OFF"
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
  email:
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: unless-stopped
